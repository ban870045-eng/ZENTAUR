<!DOCTYPE html>
<html>
<head>
  <title>ZENTAUR</title>
  <style>
    body {
      background-color: #000000;
      color: #D4AF37;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px 20px;
    }
    input[type="file"] {
      color: #D4AF37;
      margin-top: 20px;
    }
    video {
      margin-top: 20px;
      border: 2px solid #D4AF37;
      border-radius: 8px;
    }
    .controls {
      margin-top: 20px;
    }
    .controls label {
      display: block;
      margin-top: 10px;
    }
    input[type="range"] {
      width: 80%;
      accent-color: #D4AF37;
    }
    button {
      background-color: #D4AF37;
      color: #000000;
      border: none;
      padding: 10px 20px;
      margin-top: 20px;
      border-radius: 6px;
      font-weight: bold;
    }
    button:disabled {
      opacity: 0.5;
    }
    #status {
      margin-top: 15px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h1>Welcome to ZENTAUR</h1>
  <p>Your AI video editor — coming soon.</p>

  <input type="file" id="videoUpload" accept="video/*">
  <br><br>
  <video id="preview" width="300" controls></video>

  <div class="controls">
    <label>Start: <span id="startLabel">0</span>s</label>
    <input type="range" id="startRange" min="0" value="0" step="0.1">

    <label>End: <span id="endLabel">0</span>s</label>
    <input type="range" id="endRange" min="0" value="0" step="0.1">

    <br>
    <button id="previewTrim">Preview Trim</button>
    <button id="exportTrim">Export Trimmed Video</button>

    <p id="status"></p>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/ffmpeg.js/4.2.9002/ffmpeg.min.js"></script>
  <script>
    const upload = document.getElementById('videoUpload');
    const preview = document.getElementById('preview');
    const startRange = document.getElementById('startRange');
    const endRange = document.getElementById('endRange');
    const startLabel = document.getElementById('startLabel');
    const endLabel = document.getElementById('endLabel');
    const previewTrim = document.getElementById('previewTrim');
    const exportTrim = document.getElementById('exportTrim');
    const status = document.getElementById('status');

    let uploadedFile = null;

    upload.addEventListener('change', function() {
      const file = this.files[0];
      if (file) {
        uploadedFile = file;
        preview.src = URL.createObjectURL(file);
      }
    });

    preview.addEventListener('loadedmetadata', function() {
      startRange.max = preview.duration;
      endRange.max = preview.duration;
      endRange.value = preview.duration;
      endLabel.textContent = preview.duration.toFixed(1);
    });

    startRange.addEventListener('input', function() {
      startLabel.textContent = parseFloat(this.value).toFixed(1);
    });

    endRange.addEventListener('input', function() {
      endLabel.textContent = parseFloat(this.value).toFixed(1);
    });

    previewTrim.addEventListener('click', function() {
      preview.currentTime = parseFloat(startRange.value);
      preview.play();

      const checkEnd = setInterval(function() {
        if (preview.currentTime >= parseFloat(endRange.value)) {
          preview.pause();
          clearInterval(checkEnd);
        }
      }, 100);
    });

    exportTrim.addEventListener('click', async function() {
      if (!uploadedFile) {
        status.textContent = "Please upload a video first.";
        return;
      }

      exportTrim.disabled = true;
      status.textContent = "Loading video engine... this may take a moment.";

      const { createFFmpeg, fetchFile } = FFmpeg;
      const ffmpeg = createFFmpeg({ log: true });
      await ffmpeg.load();

      status.textContent = "Processing your trim...";

      ffmpeg.FS('writeFile', 'input.mp4', await fetchFile(uploadedFile));

      const start = startRange.value;
      const duration = (endRange.value - startRange.value).toFixed(2);

      await ffmpeg.run(
        '-i', 'input.mp4',
        '-ss', start.toString(),
        '-t', duration.toString(),
        '-c', 'copy',
        'output.mp4'
      );

      const data = ffmpeg.FS('readFile', 'output.mp4');
      const videoBlob = new Blob([data.buffer], { type: 'video/mp4' });
      const url = URL.createObjectURL(videoBlob);

      const link = document.createElement('a');
      link.href = url;
      link.download = 'zentaur-trimmed.mp4';
      link.click();

      status.textContent = "Done! Your trimmed video downloaded.";
      exportTrim.disabled = false;
    });
  </script>
</body>
</html>
